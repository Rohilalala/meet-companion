name: linux-port
# Account-free checks of the Linux port on a real Ubuntu ARM64 machine: branded Chrome launch, CDP attach,
# virtual audio device discovery, synthetic tone routing and native tab presentation. No meeting is joined.
on:
  push:
    branches: [linux-port]
  workflow_dispatch:
jobs:
  ubuntu-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      XDG_RUNTIME_DIR: /tmp/meet-companion-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install branded Chrome (arm64), PulseAudio and trial desktop
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pulseaudio pulseaudio-utils lsof wget iproute2 x11vnc xvfb
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
          sudo apt-get install -y -q ./google-chrome-stable_current_arm64.deb
          google-chrome-stable --version
          uname -m
      - run: npm ci
      - run: npm run check
      - run: npm run verify:offline
      - name: Create the virtual audio route
        run: |
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          npm run linux:audio
          pactl list short sinks
          pactl list short sources
      - run: npm run preflight
      - name: Loopback desktop and windowed Chrome (no accounts)
        run: |
          bash aws/start-desktop.sh
          npm run bot:login -- --dry-run
          export DISPLAY=:99
          npm run bot:launch -- --windowed
      - name: Tone through the virtual device (launch, CDP attach, device discovery, routing, fail-closed)
        run: npm run verify:route
      - name: Native tab presentation with tab audio (synthetic page)
        run: npm run verify:presentation
